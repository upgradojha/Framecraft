services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ojhaprashant/framecraft-backend:latest
    container_name: framecraft-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ojhaprashant/framecraft-frontend:latest
    container_name: framecraft-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
